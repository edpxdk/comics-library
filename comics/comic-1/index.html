<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Comic 1</title>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
      <header>
        <h1>📚 edpxdk Comics</h1>
      </header>

      <main id="reader"></main>

      <script>
        const pages = ["ch1/1.jpg", "ch1/2.jpg", "ch1/3.jpg","ch1/4.jpg", "ch1/5.jpg", "ch1/6.jpg","ch1/7.jpg", "ch1/8.jpg", "ch1/9.jpg","ch1/10.jpg", "ch1/11.jpg", "ch1/12.jpg","ch1/13.jpg", "ch1/14.jpg", "ch1/15.jpg","ch1/16.jpg", "ch1/17.jpg"];
        const reader = document.getElementById("reader");

        pages.forEach((p) => {
          const img = document.createElement("img");
          img.src = p;
          img.style.width = "100%";
          img.style.display = "block";
          reader.appendChild(img);
        });
      </script>
    </section>
  </body>
</html>
